[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiervar"
version = "0.1.0"
description = "HIERVAR: Hierarchical feature selection for time series analysis"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alireza Keshavarzian" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23,<2.0",
    "scipy>=1.9,<2.0",
    "pandas>=1.5,<3.0",
    "scikit-learn>=1.2,<2.0",
    "sktime>=0.29,<0.35",
    "kneed>=0.8,<1.0",
    "numba>=0.57,<1.0",
    "joblib>=1.2,<2.0",
    "matplotlib>=3.5,<4.0",
    "seaborn>=0.12,<0.13",
    "tqdm>=4.66,<5.0",
]

[tool.setuptools.packages.find]
include = ["hiervar*"]